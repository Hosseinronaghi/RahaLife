name: Build Raha Life

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'review/v0.10.0-dev.5']
    tags: ['v*']

permissions:
  contents: read

env:
  CI: 'true'
  DASH__SUPPRESS_ANALYTICS: 'true'
  RAHA_DROPBOX_CLIENT_ID: ${{ vars.RAHA_DROPBOX_CLIENT_ID }}
  RAHA_ONEDRIVE_CLIENT_ID: ${{ vars.RAHA_ONEDRIVE_CLIENT_ID }}
  RAHA_GOOGLE_DRIVE_CLIENT_ID: ${{ vars.RAHA_GOOGLE_DRIVE_CLIENT_ID }}
  RAHA_DROPBOX_WEB_REDIRECT_URI: ${{ vars.RAHA_DROPBOX_WEB_REDIRECT_URI }}

jobs:
  android:
    name: Android APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Check complete release source
        run: python tool/check_source_integrity.py

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.raha --project-name raha_life .
      - name: Apply Raha Life name and icon
        run: python tool/configure_branding.py

      - name: Remove generated default widget test
        run: rm -f test/widget_test.dart

      - name: Configure Android permissions and scheduled reminders
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.VIBRATE" />',
              '<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />',
              '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />',
              '<uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />',
          ]
          for permission in permissions:
              if permission not in text:
                  text = text.replace(marker, f'{marker}\n    {permission}', 1)

          application_end = '</application>'
          receivers = """
              <receiver
                  android:exported="false"
                  android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
              <receiver
                  android:exported="false"
                  android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                  <intent-filter>
                      <action android:name="android.intent.action.BOOT_COMPLETED" />
                      <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />
                  </intent-filter>
              </receiver>
          """
          if 'ScheduledNotificationReceiver' not in text:
              text = text.replace(application_end, receivers + '\n    ' + application_end, 1)
          manifest.write_text(text, encoding="utf-8")
          PY
      - name: Configure Android home screen widget
        run: python3 tool/configure_android_widget.py

      - name: Detect persistent Android release signing
        id: raha_signing
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        shell: bash
        env:
          RAHA_ANDROID_KEYSTORE_BASE64: ${{ secrets.RAHA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$RAHA_ANDROID_KEYSTORE_BASE64" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse to produce a release tag with temporary Android signing
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          SIGNING_CONFIGURED: ${{ steps.raha_signing.outputs.configured }}
          RELEASE_CERT_SHA256: ${{ vars.RAHA_ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          cert="${RELEASE_CERT_SHA256//:/}"
          if [[ "$SIGNING_CONFIGURED" != 'true' || ! "$cert" =~ ^[0-9A-Fa-f]{64}$ ]]; then
            echo "::error::A release tag requires the established Android keystore and its pinned certificate fingerprint."
            exit 1
          fi

      - name: Configure persistent Android release signing
        if: ${{ steps.raha_signing.outputs.configured == 'true' }}
        shell: bash
        env:
          RAHA_ANDROID_KEYSTORE_BASE64: ${{ secrets.RAHA_ANDROID_KEYSTORE_BASE64 }}
          RAHA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RAHA_ANDROID_KEYSTORE_PASSWORD }}
          RAHA_ANDROID_KEY_ALIAS: ${{ secrets.RAHA_ANDROID_KEY_ALIAS }}
          RAHA_ANDROID_KEY_PASSWORD: ${{ secrets.RAHA_ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$RAHA_ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/raha-release.jks
          python3 tool/configure_android_release_signing.py

      - name: Record Android signing mode
        shell: bash
        run: |
          mkdir -p release/android
          if [[ -f android/app/raha-release.jks ]]; then
            echo "Persistent release signing: configured" > release/android/SIGNING_STATUS.txt
          else
            echo "Persistent release signing: NOT configured. This CI artifact must not be relied on for in-place production upgrades." > release/android/SIGNING_STATUS.txt
          fi

      - name: Enable Android core library desugaring
        run: python3 tool/configure_android_desugaring.py

      - name: Clean generated build state
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localization and database code
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze and test
        run: |
          flutter analyze --fatal-infos
          flutter test

      - name: Build universal APK
        run: |
          python tool/write_oauth_build_config.py android
          flutter build apk --release --build-name="$(python3 tool/check_app_version.py)" --dart-define-from-file=build/oauth-android.json
          mkdir -p release/android
          cp build/app/outputs/flutter-apk/app-release.apk release/android/Raha-Life-universal-release.apk

      - name: Build split APKs
        run: |
          python tool/write_oauth_build_config.py android
          flutter build apk --release --build-name="$(python3 tool/check_app_version.py)" --split-per-abi --dart-define-from-file=build/oauth-android.json

      - name: Build Android App Bundle
        run: |
          python tool/write_oauth_build_config.py android
          flutter build appbundle --release --build-name="$(python3 tool/check_app_version.py)" --dart-define-from-file=build/oauth-android.json

      - name: Rename Android artifacts
        shell: bash
        run: |
          mkdir -p release/android
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/android/Raha-Life-arm64-v8a-release.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release/android/Raha-Life-armeabi-v7a-release.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release/android/Raha-Life-x86_64-release.apk
          cp build/app/outputs/bundle/release/app-release.aab release/android/Raha-Life-release.aab
          cd release/android
          sha256sum *.apk *.aab SIGNING_STATUS.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Verify the generated Android version and package ID
        shell: bash
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          aapt="$(find "$sdk/build-tools" -name aapt -type f -executable | sort -V | tail -1)"
          test -n "$aapt"
          expected_version="$(python3 tool/check_app_version.py)"
          expected_code="$(sed -nE 's/^version: .*\+([0-9]+)$/\1/p' pubspec.yaml)"
          for apk in release/android/*.apk; do
            manifest="$("$aapt" dump badging "$apk" | sed -n '/^package:/p')"
            [[ "$manifest" == *"name='com.raha.raha_life'"* ]]
            [[ "$manifest" == *"versionName='$expected_version'"* ]]
            if [[ "$apk" == *universal* ]]; then
              [[ "$manifest" == *"versionCode='$expected_code'"* ]]
            fi
          done

      - name: Compare tagged APKs with the established release certificate
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASE_CERT_SHA256: ${{ vars.RAHA_ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(find "$sdk/build-tools" -name apksigner -type f -executable | sort -V | tail -1)"
          test -n "$apksigner"
          expected="${RELEASE_CERT_SHA256//:/}"
          for apk in release/android/*.apk; do
            actual="$("$apksigner" verify --print-certs "$apk" | sed -nE 's/^Signer #[0-9]+ certificate SHA-256 digest: ([0-9A-Fa-f]+)$/\1/p')"
            if [[ "${actual,,}" != "${expected,,}" ]]; then
              echo "::error::APK signing certificate does not match the established release certificate."
              exit 1
            fi
          done

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Raha-Life-Android
          path: release/android/
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows portable package
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Check complete release source
        run: python tool/check_source_integrity.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Enable and generate Windows platform
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --org com.raha --project-name raha_life .
          python tool/configure_branding.py

      - name: Remove generated default widget test
        shell: pwsh
        run: |
          if (Test-Path "test/widget_test.dart") {
            Remove-Item "test/widget_test.dart" -Force
          }

      - name: Clean generated build state
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localization and database code
        shell: pwsh
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze and test
        shell: pwsh
        run: |
          flutter analyze --fatal-infos
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows release
        run: |
          python tool/write_oauth_build_config.py windows
          flutter build windows --release --dart-define-from-file=build/oauth-windows.json

      - name: Package Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath release/Raha-Life-Windows-x64-portable.zip -Force
          (Get-FileHash release/Raha-Life-Windows-x64-portable.zip -Algorithm SHA256).Hash + '  Raha-Life-Windows-x64-portable.zip' | Out-File -Encoding ascii release/SHA256SUMS.txt

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Raha-Life-Windows
          path: release/
          if-no-files-found: error
          retention-days: 30


  web:
    name: Web release package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Check complete release source
        run: python tool/check_source_integrity.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Generate Web platform
        run: flutter create --platforms=web --org com.raha --project-name raha_life .
      - name: Apply Raha Life name and icon
        run: python tool/configure_branding.py

      - name: Remove generated default widget test
        run: rm -f test/widget_test.dart

      - name: Clean generated build state
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localization and database code
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze and test
        run: |
          flutter analyze --fatal-infos
          flutter test

      - name: Prepare Drift web runtime
        run: bash tool/prepare_drift_web.sh

      - name: Build Web release
        run: |
          python tool/write_oauth_build_config.py web
          flutter build web --release --dart-define-from-file=build/oauth-web.json

      - name: Package Web release
        run: |
          mkdir -p release/web
          cd build/web
          zip -r ../../release/web/Raha-Life-Web-release.zip .
          cd ../..
          cd release/web
          sha256sum Raha-Life-Web-release.zip > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: Raha-Life-Web
          path: release/web/
          if-no-files-found: error
          retention-days: 30
