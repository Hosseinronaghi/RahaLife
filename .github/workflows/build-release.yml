name: Build Raha Life

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  android:
    name: Android APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Check complete release source
        run: python tool/check_source_integrity.py

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.raha --project-name raha_life .

      - name: Remove generated default widget test
        run: rm -f test/widget_test.dart

      - name: Configure Android permissions and scheduled reminders
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.VIBRATE" />',
              '<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />',
              '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />',
              '<uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />',
          ]
          for permission in permissions:
              if permission not in text:
                  text = text.replace(marker, f'{marker}\n    {permission}', 1)

          application_end = '</application>'
          receivers = """
              <receiver
                  android:exported="false"
                  android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
              <receiver
                  android:exported="false"
                  android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                  <intent-filter>
                      <action android:name="android.intent.action.BOOT_COMPLETED" />
                      <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />
                  </intent-filter>
              </receiver>
          """
          if 'ScheduledNotificationReceiver' not in text:
              text = text.replace(application_end, receivers + '\n    ' + application_end, 1)
          manifest.write_text(text, encoding="utf-8")
          PY
      - name: Configure Android home screen widget
        run: python3 tool/configure_android_widget.py

      - name: Detect persistent Android release signing
        id: raha_signing
        shell: bash
        env:
          RAHA_ANDROID_KEYSTORE_BASE64: ${{ secrets.RAHA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$RAHA_ANDROID_KEYSTORE_BASE64" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure persistent Android release signing
        if: ${{ steps.raha_signing.outputs.configured == 'true' }}
        shell: bash
        env:
          RAHA_ANDROID_KEYSTORE_BASE64: ${{ secrets.RAHA_ANDROID_KEYSTORE_BASE64 }}
          RAHA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RAHA_ANDROID_KEYSTORE_PASSWORD }}
          RAHA_ANDROID_KEY_ALIAS: ${{ secrets.RAHA_ANDROID_KEY_ALIAS }}
          RAHA_ANDROID_KEY_PASSWORD: ${{ secrets.RAHA_ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$RAHA_ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/raha-release.jks
          python3 tool/configure_android_release_signing.py

      - name: Record Android signing mode
        shell: bash
        run: |
          mkdir -p release/android
          if [[ -f android/app/raha-release.jks ]]; then
            echo "Persistent release signing: configured" > release/android/SIGNING_STATUS.txt
          else
            echo "Persistent release signing: NOT configured. This CI artifact must not be relied on for in-place production upgrades." > release/android/SIGNING_STATUS.txt
          fi

      - name: Enable Android core library desugaring
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle.kts")
          if not gradle.exists():
              raise SystemExit("android/app/build.gradle.kts was not generated")

          text = gradle.read_text(encoding="utf-8")

          if "isCoreLibraryDesugaringEnabled = true" not in text:
              compile_marker = "    compileOptions {"
              start = text.find(compile_marker)
              if start == -1:
                  android_marker = "android {"
                  block = '''android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  isCoreLibraryDesugaringEnabled = true
              }
          '''
                  text = text.replace(android_marker, block, 1)
              else:
                  end = text.find("    }", start)
                  if end == -1:
                      raise SystemExit("Could not locate compileOptions block end")
                  block = text[start:end + 5]
                  if "sourceCompatibility" in block:
                      block = block.replace(
                          "sourceCompatibility = JavaVersion.VERSION_11",
                          "sourceCompatibility = JavaVersion.VERSION_17",
                      ).replace(
                          "targetCompatibility = JavaVersion.VERSION_11",
                          "targetCompatibility = JavaVersion.VERSION_17",
                      )
                      block = block.replace(
                          "sourceCompatibility = JavaVersion.VERSION_17\n",
                          "sourceCompatibility = JavaVersion.VERSION_17\n        isCoreLibraryDesugaringEnabled = true\n",
                          1,
                      )
                  else:
                      block = block[:-5] + '''        sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  isCoreLibraryDesugaringEnabled = true
              }'''
                  text = text[:start] + block + text[end + 5:]

          dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          if dependency not in text:
              text += f'''\n\ndependencies {{\n    {dependency}\n}}\n'''

          gradle.write_text(text, encoding="utf-8")
          print(gradle.read_text(encoding="utf-8"))
          PY

      - name: Clean generated build state
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localization and database code
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze and test
        run: |
          flutter analyze --fatal-infos
          flutter test

      - name: Build universal APK
        run: |
          flutter build apk --release
          mkdir -p release/android
          cp build/app/outputs/flutter-apk/app-release.apk release/android/Raha-Life-universal-release.apk

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Rename Android artifacts
        shell: bash
        run: |
          mkdir -p release/android
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/android/Raha-Life-arm64-v8a-release.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release/android/Raha-Life-armeabi-v7a-release.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release/android/Raha-Life-x86_64-release.apk
          cp build/app/outputs/bundle/release/app-release.aab release/android/Raha-Life-release.aab
          sha256sum release/android/* > release/android/SHA256SUMS.txt

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Raha-Life-Android
          path: release/android/
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows portable package
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Check complete release source
        run: python tool/check_source_integrity.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Enable and generate Windows platform
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --org com.raha --project-name raha_life .

      - name: Remove generated default widget test
        shell: pwsh
        run: |
          if (Test-Path "test/widget_test.dart") {
            Remove-Item "test/widget_test.dart" -Force
          }

      - name: Clean generated build state
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localization and database code
        shell: pwsh
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze and test
        shell: pwsh
        run: |
          flutter analyze --fatal-infos
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath release/Raha-Life-Windows-x64-portable.zip -Force
          (Get-FileHash release/Raha-Life-Windows-x64-portable.zip -Algorithm SHA256).Hash + '  Raha-Life-Windows-x64-portable.zip' | Out-File -Encoding ascii release/SHA256SUMS.txt

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Raha-Life-Windows
          path: release/
          if-no-files-found: error
          retention-days: 30


  web:
    name: Web release package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Check complete release source
        run: python tool/check_source_integrity.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Generate Web platform
        run: flutter create --platforms=web --org com.raha --project-name raha_life .

      - name: Remove generated default widget test
        run: rm -f test/widget_test.dart

      - name: Clean generated build state
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localization and database code
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze and test
        run: |
          flutter analyze --fatal-infos
          flutter test

      - name: Prepare Drift web runtime
        run: bash tool/prepare_drift_web.sh

      - name: Build Web release
        run: flutter build web --release

      - name: Package Web release
        run: |
          mkdir -p release/web
          cd build/web
          zip -r ../../release/web/Raha-Life-Web-release.zip .
          cd ../..
          sha256sum release/web/Raha-Life-Web-release.zip > release/web/SHA256SUMS.txt

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: Raha-Life-Web
          path: release/web/
          if-no-files-found: error
          retention-days: 30
