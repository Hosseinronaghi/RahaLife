name: Build Raha Life

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  android:
    name: Android APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.raha --project-name raha_life .

      - name: Remove generated default widget test
        run: rm -f test/widget_test.dart

      - name: Enable Android core library desugaring
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle.kts")
          if not gradle.exists():
              raise SystemExit("android/app/build.gradle.kts was not generated")

          text = gradle.read_text(encoding="utf-8")

          if "isCoreLibraryDesugaringEnabled = true" not in text:
              compile_marker = "    compileOptions {"
              start = text.find(compile_marker)
              if start == -1:
                  android_marker = "android {"
                  block = '''android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  isCoreLibraryDesugaringEnabled = true
              }
          '''
                  text = text.replace(android_marker, block, 1)
              else:
                  end = text.find("    }", start)
                  if end == -1:
                      raise SystemExit("Could not locate compileOptions block end")
                  block = text[start:end + 5]
                  if "sourceCompatibility" in block:
                      block = block.replace(
                          "sourceCompatibility = JavaVersion.VERSION_11",
                          "sourceCompatibility = JavaVersion.VERSION_17",
                      ).replace(
                          "targetCompatibility = JavaVersion.VERSION_11",
                          "targetCompatibility = JavaVersion.VERSION_17",
                      )
                      block = block.replace(
                          "sourceCompatibility = JavaVersion.VERSION_17\n",
                          "sourceCompatibility = JavaVersion.VERSION_17\n        isCoreLibraryDesugaringEnabled = true\n",
                          1,
                      )
                  else:
                      block = block[:-5] + '''        sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  isCoreLibraryDesugaringEnabled = true
              }'''
                  text = text[:start] + block + text[end + 5:]

          dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          if dependency not in text:
              text += f'''\n\ndependencies {{\n    {dependency}\n}}\n'''

          gradle.write_text(text, encoding="utf-8")
          print(gradle.read_text(encoding="utf-8"))
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localization and database code
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze and test
        run: |
          flutter analyze --fatal-infos
          flutter test

      - name: Build universal APK
        run: flutter build apk --release

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Rename Android artifacts
        shell: bash
        run: |
          mkdir -p release/android
          cp build/app/outputs/flutter-apk/app-release.apk release/android/Raha-Life-universal-release.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/android/Raha-Life-arm64-v8a-release.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release/android/Raha-Life-armeabi-v7a-release.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release/android/Raha-Life-x86_64-release.apk
          cp build/app/outputs/bundle/release/app-release.aab release/android/Raha-Life-release.aab
          sha256sum release/android/* > release/android/SHA256SUMS.txt

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Raha-Life-Android
          path: release/android/
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows portable package
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable and generate Windows platform
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --org com.raha --project-name raha_life .

      - name: Remove generated default widget test
        shell: pwsh
        run: |
          if (Test-Path "test/widget_test.dart") {
            Remove-Item "test/widget_test.dart" -Force
          }

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localization and database code
        shell: pwsh
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze and test
        shell: pwsh
        run: |
          flutter analyze --fatal-infos
          flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath release/Raha-Life-Windows-x64-portable.zip -Force
          (Get-FileHash release/Raha-Life-Windows-x64-portable.zip -Algorithm SHA256).Hash + '  Raha-Life-Windows-x64-portable.zip' | Out-File -Encoding ascii release/SHA256SUMS.txt

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Raha-Life-Windows
          path: release/
          if-no-files-found: error
          retention-days: 30
