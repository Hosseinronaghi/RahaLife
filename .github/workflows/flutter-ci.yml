name: Flutter CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - master
    tags-ignore:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Generate temporary platform files
        run: flutter create --platforms=android --org com.raha --project-name raha_life .
      - name: Remove generated default widget test
        run: rm -f test/widget_test.dart
      - run: flutter clean
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze --fatal-infos
      - run: flutter test
