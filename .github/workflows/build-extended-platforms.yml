name: Build Raha Life Extended Platforms

on:
  workflow_dispatch:
  push:
    branches: ['review/v0.10.0-dev.5']

permissions:
  contents: read

env:
  CI: 'true'
  DASH__SUPPRESS_ANALYTICS: 'true'
  RAHA_DROPBOX_CLIENT_ID: ${{ vars.RAHA_DROPBOX_CLIENT_ID }}
  RAHA_ONEDRIVE_CLIENT_ID: ${{ vars.RAHA_ONEDRIVE_CLIENT_ID }}
  RAHA_DROPBOX_WEB_REDIRECT_URI: ${{ vars.RAHA_DROPBOX_WEB_REDIRECT_URI }}

jobs:
  linux:
    name: Linux x64 portable
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Check complete release source
        run: python tool/check_source_integrity.py
      - name: Install Linux desktop requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev pulseaudio-utils ffmpeg libwebkit2gtk-4.1-dev libsoup-3.0-dev libmpv-dev
          pkg-config --modversion mpv
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Generate Linux platform
        run: |
          flutter config --enable-linux-desktop
          flutter create --platforms=linux --org com.raha --project-name raha_life .
          python tool/configure_branding.py
          rm -f test/widget_test.dart
      - run: flutter clean
      - run: flutter pub get
      - name: Generate code
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Analyze and test
        run: |
          flutter analyze --fatal-infos
          flutter test
      - name: Build Linux release
        run: |
          python tool/write_oauth_build_config.py linux
          flutter build linux --release --dart-define-from-file=build/oauth-linux.json
      - name: Package Linux
        run: |
          mkdir -p release/linux
          tar -C build/linux/x64/release/bundle -czf release/linux/Raha-Life-Linux-x64-portable.tar.gz .
          printf '%s\n' \
            'Raha Life for Linux x86-64. System libraries are not bundled.' \
            'On Ubuntu 24.04 install: libgtk-3-0t64 libsecret-1-0 libwebkit2gtk-4.1-0 libmpv2 ffmpeg.' \
            'Extract the archive and start raha_life from the extracted directory.' \
            > release/linux/READ_ME.txt
          sha256sum release/linux/Raha-Life-Linux-x64-portable.tar.gz > release/linux/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Raha-Life-Linux
          path: release/linux/
          if-no-files-found: error
          retention-days: 30

