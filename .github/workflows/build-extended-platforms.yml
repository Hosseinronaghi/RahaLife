name: Build Raha Life Extended Platforms

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux x64 portable
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux desktop requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Linux platform
        run: |
          flutter config --enable-linux-desktop
          flutter create --platforms=linux --org com.raha --project-name raha_life .
          rm -f test/widget_test.dart
      - run: flutter pub get
      - name: Generate code
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Analyze and test
        run: |
          flutter analyze --fatal-infos
          flutter test
      - name: Build Linux release
        run: flutter build linux --release
      - name: Package Linux
        run: |
          mkdir -p release/linux
          tar -C build/linux/x64/release/bundle -czf release/linux/Raha-Life-Linux-x64-portable.tar.gz .
          sha256sum release/linux/Raha-Life-Linux-x64-portable.tar.gz > release/linux/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Raha-Life-Linux
          path: release/linux/
          if-no-files-found: error
          retention-days: 30

  apple:
    name: macOS and iOS simulator
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Apple platforms
        run: |
          flutter config --enable-macos-desktop
          flutter create --platforms=ios,macos --org com.raha --project-name raha_life .
          rm -f test/widget_test.dart
      - run: flutter pub get
      - name: Generate code
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Analyze and test
        run: |
          flutter analyze --fatal-infos
          flutter test
      - name: Build macOS release
        run: flutter build macos --release
      - name: Build iOS simulator
        run: flutter build ios --simulator --debug --no-codesign
      - name: Package Apple artifacts
        run: |
          mkdir -p release/apple
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/raha_life.app release/apple/Raha-Life-macOS.zip
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app release/apple/Raha-Life-iOS-Simulator.zip
          shasum -a 256 release/apple/* > release/apple/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Raha-Life-Apple
          path: release/apple/
          if-no-files-found: error
          retention-days: 30
