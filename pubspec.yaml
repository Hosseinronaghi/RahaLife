name: raha_life
description: Premium offline-first bilingual personal organizer with optional online AI assistants.
publish_to: none
version: 0.5.1+10
environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  intl: ^0.20.2
  shamsi_date: ^1.1.1
  google_fonts: ^8.2.0
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.39
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.3
  connectivity_plus: ^6.1.4
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.0
  collection: ^1.19.1
  crypto: ^3.0.7
  share_plus: ^12.0.2
  persian_fonts: ^1.0.6
  flutter_quill: ^11.5.1
  home_widget: ^0.9.3
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.5.4

flutter:
  uses-material-design: true
