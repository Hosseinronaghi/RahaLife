name: raha_life
description: Premium offline-first bilingual personal organizer with optional online AI assistants.
publish_to: none
version: 0.9.0+16
environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  intl: ^0.20.2
  shamsi_date: ^1.1.1
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.39
  sqlite3: 2.9.4
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  url_launcher: ^6.3.2
  dio: ^5.8.0+1
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.3
  connectivity_plus: ^6.1.4
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.0
  collection: ^1.19.1
  crypto: ^3.0.7
  cryptography: 2.9.0
  dartssh2: 2.22.5
  share_plus: 13.3.0
  flutter_quill: ^11.5.1
  home_widget: ^0.9.3
  file_picker: 12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.5.4

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn.ttf
